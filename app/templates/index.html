<!DOCTYPE html>
<html lang="en">
<head>
    <title>Kafka Activity Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #333;
            color: white;
            padding: 15px 25px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        h2 {
            margin-top: 30px;
        }

        button, select, input[type="text"], input[type="range"] {
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            background: #0077ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #005fcc;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="range"] {
            width: 100%;
        }

        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

    </style>
</head>
<body>

<header>
    <h1>Website Activity Simulator</h1>
</header>

<div class="container">

    <h2>Button Clicks</h2>
    <button>Click Me</button>
    <button>Click</button>
    <button>Don't Click?</button>

    <h2>Slider Input</h2>
    <label>
        <input type="range" min="0" max="100" value="50">
    </label>

    <h2>Dropdown Selection</h2>
    <label>
        <select>
            <option value="">-- Favourite Day of the Week --</option>
            <option value="Sunday">Sunday</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
        </select>
    </label>

    <h2>Text Input</h2>
    <label>
        <input type="text" placeholder="Type something...">
    </label>

    <h2>Toggle Switch</h2>
    <div class="toggle-wrapper">
        <input type="checkbox" id="toggle">
        <label for="toggle">Enable Me</label>
    </div>

</div>

<script>
    function sendEvent(eventName, details = {}) {
        fetch("/event", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                event: eventName,
                details: details,
                timestamp: Date.now()
            })
        });
    }

    // Logs an event every time someone opens website
    window.addEventListener("load", () => {
        sendEvent("page_load");
    });

    // Logs an event every time a button is clicked
    document.addEventListener("click", (e) => {
        if (e.target.tagName === "BUTTON") {
            sendEvent("button_click", {
                text: e.target.innerText
            });
        }
    });

    // Logs an event every time a slider is moved
    document.querySelector('input[type="range"]').addEventListener("input", (e) => {
        sendEvent("slider_input", {
            value: e.target.value
        });
    });

    // Logs an event every time dropdown selection is changed
    document.querySelector("select").addEventListener("change", (e) => {
        sendEvent("dropdown_selection", {
            value: e.target.value
        });
    });

    // Logs an event every time text input is changed
    document.querySelector('input[type="text"]').addEventListener("input", (e) => {
        sendEvent("text_input", { value: e.target.value });
    });

    // Logs an event every time toggle switch is toggled
    document.querySelector('#toggle').addEventListener("change", (e) => {
        sendEvent("toggle_switch", { checked: e.target.checked });
    });
</script>
</body>
</html>
